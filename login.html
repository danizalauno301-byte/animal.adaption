
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Animal Adoption and Care System</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css?v=20261113">

    
</head>

<body class="login-page">

    <main class="login-container">
        <section class="login-form-section">

            <div class="login-form-box">

                <div class="login-heading">
                    <h2>Staff Login</h2>
                    <p>Enter your administrator account details to continue.</p>
                </div>

                <form id="loginForm">

                    <div class="login-form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            required
                        >
                    </div>

                    <div class="login-form-group">
                        <label for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                required
                            >
                            <button
                                type="button"
                                class="password-toggle"
                                aria-controls="password"
                                aria-label="Show password"
                                aria-pressed="false"
                            >Show</button>
                        </div>
                    </div>

                    <div class="login-options">
                        <label>
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="login-button">
                        Login
                    </button>

                    <div id="loginMessage" class="login-message-box"></div>

                </form>

                <a href="./admin-register.html" class="admin-register-link">
                    Create Admin Account
                </a>

                <a href="./index.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </section>
    </main>

    <script src="database.js?v=final-20261113"></script>
    <script src="password-toggle.js"></script>
    <script src="script.js?v=final-20261113"></script>
    <script src="enhance.js?v=20261113"></script>

</body>
</html>

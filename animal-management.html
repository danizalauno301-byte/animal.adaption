
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Management | Admin</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css?v=20261113">
    
</head>

<body class="dashboard-page">

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Animal Adoption & Care</div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="animal-management.html" class="active">Animal Records</a></li>
                <li><a href="care.html">Care & Medical</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="#" id="logoutButton">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="management-page">

        <header class="management-heading">
            <span class="section-label">ADMINISTRATION</span>
            <h1>Manage Animal Records</h1>
            <p>Add, edit, search, and manage registered animal records.</p>
        </header>

        <section class="management-panel">

            <div class="management-controls">
                <button type="button" id="showAddAnimalForm">+ Add Animal</button>
            </div>

            <section class="animal-form-section" id="animalFormSection" style="display:none;">

                <h2 id="animalFormTitle">Add New Animal</h2>

                <form id="animalForm">

                    <input type="hidden" id="editAnimalId">

                    <div class="animal-form-grid">

                        <div class="form-group">
                            <label for="animalName">Animal Name</label>
                            <input type="text" id="animalName" placeholder="Enter animal name" required>
                        </div>

                        <div class="form-group">
                            <label for="animalRecordType">Type</label>
                            <select id="animalRecordType" required>
                                <option value="">Select Type</option>
                                <option value="Dog">Dog</option>
                                <option value="Cat">Cat</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalAge">Age</label>
                            <input type="text" id="animalAge" placeholder="Example: 2 years" required>
                        </div>

                        <div class="form-group">
                            <label for="animalGender">Gender</label>
                            <select id="animalGender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalHealth">Health Status</label>
                            <select id="animalHealth" required>
                                <option value="Healthy">Healthy</option>
                                <option value="Under Treatment">Under Treatment</option>
                                <option value="Needs Monitoring">Needs Monitoring</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalVaccination">Vaccination</label>
                            <select id="animalVaccination" required>
                                <option value="Up to date">Up to date</option>
                                <option value="Partially Vaccinated">Partially Vaccinated</option>
                                <option value="Not Vaccinated">Not Vaccinated</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalCare">Care Status</label>
                            <select id="animalCare" required>
                                <option value="Regular care">Regular care</option>
                                <option value="Special care">Special care</option>
                                <option value="Close monitoring">Close monitoring</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalStatus">Adoption Status</label>
                            <select id="animalStatus" required>
                                <option value="Available">Available</option>
                                <option value="Pending">Pending</option>
                                <option value="Adopted">Adopted</option>
                            </select>
                        </div>

                        <div class="form-group form-full">
                            <label for="animalPhoto">Animal Photograph (optional, max 2 MB)</label>
                            <input type="file" id="animalPhoto" accept="image/*">
                            <input type="hidden" id="animalImage">
                            <img id="animalImagePreview" class="animal-image-preview" alt="Animal photo preview" style="display:none;">
                        </div>

                        <div class="form-group form-full">
                            <label for="animalDescription">Description</label>
                            <textarea id="animalDescription" rows="4" required></textarea>
                        </div>

                    </div>

                    <div class="animal-form-actions">
                        <button type="submit" class="save-animal-btn">Save Animal</button>
                        <button type="button" class="cancel-animal-btn" id="cancelAnimalForm">Cancel</button>
                    </div>

                </form>
            </section>

            <div class="management-controls">
                <input type="text" id="animalRecordSearch" placeholder="Search animal records...">

                <select id="animalRecordFilter">
                    <option value="all">All Records</option>
                    <option value="dog">Dogs</option>
                    <option value="cat">Cats</option>
                </select>
            </div>

            <div class="animal-grid" id="animalRecordList"></div>

            <div id="noAnimalRecords" class="no-animal-records" style="display:none;">
                <h3>No Animal Records</h3>
                <p>Add an animal record to display it here.</p>
            </div>

        </section>

        <a href="dashboard.html">← Back to Admin Dashboard</a>

    </main>

    <script src="database.js?v=final-20261113"></script>
    <script src="script.js?v=final-20261113"></script>
    <script src="enhance.js?v=20261113"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopter Login | Animal Care System</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .adopter-auth-container {
            max-width: 480px;
            margin: 75px auto;
            padding: 0 20px;
        }

        .adopter-auth-card {
            background: #fffaf2;
            padding: 38px;
            border: 1px solid rgba(108, 77, 60, 0.12);
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(65, 46, 37, 0.10);
        }

        .adopter-auth-card h1 {
            color: #5b4033;
            font-family: Georgia, "Times New Roman", serif;
            margin-bottom: 8px;
        }

        .adopter-auth-card p {
            color: #786458;
            line-height: 1.6;
        }

        .adopter-auth-card label {
            display: block;
            margin: 18px 0 7px;
            color: #5f4639;
            font-size: 13px;
            font-weight: 700;
        }

        .adopter-auth-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #dbc7b1;
            border-radius: 10px;
            background: #fffdf8;
            font-size: 14px;
        }

        .adopter-auth-card button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #9a6047;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .adopter-auth-card button:hover {
            background: #7f4c38;
        }

        .auth-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
        }

        .auth-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .auth-links a {
            color: #9a6047;
            font-weight: 700;
        }

        @media (max-width: 550px) {
            .adopter-auth-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="adopter-auth-container">
        <section class="adopter-auth-card">

            <h1>Adopter Login</h1>
            <p>
                Log in to your adopter account to continue
                with your animal adoption application.
            </p>

            <form id="adopterLoginForm">

                <label for="adopterLoginUsername">Username</label>
                <input
                    type="text"
                    id="adopterLoginUsername"
                    placeholder="Enter your username"
                    required
                >

                <label for="adopterLoginPassword">Password</label>
                <input
                    type="password"
                    id="adopterLoginPassword"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Log In</button>

                <div
                    id="adopterLoginMessage"
                    class="auth-message"
                    role="alert"
                ></div>

            </form>

            <div class="auth-links">
                Don't have an account?
                <a href="register.html">Register here</a>
                <br><br>
                <a href="index.html">Back to Home</a>
                <br><br>
                <a href="login.html">Staff Login</a>
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>

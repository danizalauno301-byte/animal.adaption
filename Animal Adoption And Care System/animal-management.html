
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Management | Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .management-page {
            max-width: 1250px;
            margin: 45px auto;
            padding: 0 22px;
        }

        .management-heading {
            margin-bottom: 30px;
        }

        .management-heading h1 {
            color: #49382e;
            font-family: Georgia, serif;
            font-size: 38px;
        }

        .management-panel {
            background: #fffaf2;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #eadfd4;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(65,46,37,.07);
        }

        .management-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .management-controls input,
        .management-controls select {
            padding: 13px;
            border: 1px solid #ddc9b7;
            border-radius: 9px;
            background: white;
            font-size: 15px;
        }

        .management-controls input {
            flex: 1;
            min-width: 220px;
        }

        .management-page button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #936044;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .management-page button:hover {
            background: #704831;
        }

        .management-page .cancel-animal-btn {
            background: #ded4ca;
            color: #49382e;
        }

        .management-page .animal-form-section {
            background: #fff;
            padding: 25px;
            border: 1px solid #eadfd4;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .management-page .animal-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .management-page .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .management-page .form-group input,
        .management-page .form-group select,
        .management-page .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ddc9b7;
            border-radius: 8px;
            font: inherit;
        }

        .management-page .form-full {
            grid-column: 1 / -1;
        }

        .management-page .animal-form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .management-page .animal-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .management-page .animal-record-card {
            background: white;
            border: 1px solid #eadfd4;
            border-radius: 12px;
            padding: 18px;
        }

        .management-page .animal-record-layout {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .management-page .animal-record-image {
            width: 130px;
            height: 130px;
            object-fit: cover;
            border-radius: 10px;
        }

        .management-page .animal-record-content {
            flex: 1;
        }

        .management-page .animal-record-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .management-page .delete-animal-btn {
            background: #a94339;
        }

        .management-page .no-animal-records {
            padding: 25px;
            text-align: center;
        }

        @media(max-width: 650px) {
            .management-page .animal-form-grid {
                grid-template-columns: 1fr;
            }

            .management-page .form-full {
                grid-column: auto;
            }

            .management-page .animal-record-layout {
                flex-direction: column;
                align-items: flex-start;
            }

            .management-page .animal-record-image {
                width: 100%;
                height: 190px;
            }
        }
    </style>
</head>

<body class="dashboard-page">

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Animal Adoption & Care</div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="animal-management.html" class="active">Animal Records</a></li>
                <li><a href="care.html">Care & Medical</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="#" id="logoutButton">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="management-page">

        <header class="management-heading">
            <span class="section-label">ADMINISTRATION</span>
            <h1>Manage Animal Records</h1>
            <p>Add, edit, search, and manage registered animal records.</p>
        </header>

        <section class="management-panel">

            <div class="management-controls">
                <button type="button" id="showAddAnimalForm">+ Add Animal</button>
            </div>

            <section class="animal-form-section" id="animalFormSection" style="display:none;">

                <h2 id="animalFormTitle">Add New Animal</h2>

                <form id="animalForm">

                    <input type="hidden" id="editAnimalId">

                    <div class="animal-form-grid">

                        <div class="form-group">
                            <label for="animalName">Animal Name</label>
                            <input type="text" id="animalName" placeholder="Enter animal name" required>
                        </div>

                        <div class="form-group">
                            <label for="animalRecordType">Type</label>
                            <select id="animalRecordType" required>
                                <option value="">Select Type</option>
                                <option value="Dog">Dog</option>
                                <option value="Cat">Cat</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalAge">Age</label>
                            <input type="text" id="animalAge" placeholder="Example: 2 years" required>
                        </div>

                        <div class="form-group">
                            <label for="animalGender">Gender</label>
                            <select id="animalGender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalHealth">Health Status</label>
                            <select id="animalHealth" required>
                                <option value="Healthy">Healthy</option>
                                <option value="Under Treatment">Under Treatment</option>
                                <option value="Needs Monitoring">Needs Monitoring</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalVaccination">Vaccination</label>
                            <select id="animalVaccination" required>
                                <option value="Up to date">Up to date</option>
                                <option value="Partially Vaccinated">Partially Vaccinated</option>
                                <option value="Not Vaccinated">Not Vaccinated</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalCare">Care Status</label>
                            <select id="animalCare" required>
                                <option value="Regular care">Regular care</option>
                                <option value="Special care">Special care</option>
                                <option value="Close monitoring">Close monitoring</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="animalStatus">Adoption Status</label>
                            <select id="animalStatus" required>
                                <option value="Available">Available</option>
                                <option value="Pending">Pending</option>
                                <option value="Adopted">Adopted</option>
                            </select>
                        </div>

                        <div class="form-group form-full">
                            <label for="animalDescription">Description</label>
                            <textarea id="animalDescription" rows="4" required></textarea>
                        </div>

                    </div>

                    <div class="animal-form-actions">
                        <button type="submit" class="save-animal-btn">Save Animal</button>
                        <button type="button" class="cancel-animal-btn" id="cancelAnimalForm">Cancel</button>
                    </div>

                </form>
            </section>

            <div class="management-controls">
                <input type="text" id="animalRecordSearch" placeholder="Search animal records...">

                <select id="animalRecordFilter">
                    <option value="all">All Records</option>
                    <option value="dog">Dogs</option>
                    <option value="cat">Cats</option>
                </select>
            </div>

            <div class="animal-grid" id="animalRecordList"></div>

            <div id="noAnimalRecords" class="no-animal-records" style="display:none;">
                <h3>No Animal Records</h3>
                <p>Add an animal record to display it here.</p>
            </div>

        </section>

        <a href="dashboard.html">← Back to Admin Dashboard</a>

    </main>

    <script src="script.js"></script>
    
<script>
document.addEventListener("DOMContentLoaded", function () {

    const formSection = document.getElementById("animalFormSection");
    const animalForm = document.getElementById("animalForm");
    const addButton = document.getElementById("showAddAnimalForm");
    const cancelButton = document.getElementById("cancelAnimalForm");
    const recordList = document.getElementById("animalRecordList");

    // Show the form when Add Animal is clicked
    if (addButton) {
        addButton.addEventListener("click", function () {
            formSection.style.display = "block";
            animalForm.style.display = "block";
            document.getElementById("animalFormTitle").textContent = "Add New Animal";
        });
    }

    // Show the form when Edit is clicked
    if (recordList) {
        recordList.addEventListener("click", function (event) {
            if (event.target.closest(".edit-animal-btn")) {
                formSection.style.display = "block";
                animalForm.style.display = "block";
                document.getElementById("animalFormTitle").textContent = "Edit Animal Record";

                setTimeout(function () {
                    formSection.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                }, 100);
            }
        });
    }

    // Hide the form when Cancel is clicked
    if (cancelButton) {
        cancelButton.addEventListener("click", function () {
            formSection.style.display = "none";
            animalForm.reset();
            document.getElementById("editAnimalId").value = "";
        });
    }

    // Hide the form section after saving
    if (animalForm) {
        animalForm.addEventListener("submit", function () {
            setTimeout(function () {
                if (animalForm.style.display === "none") {
                    formSection.style.display = "none";
                }
            }, 100);
        });
    }

});
</script>
</body>
</html>

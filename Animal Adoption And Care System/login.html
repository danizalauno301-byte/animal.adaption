
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Animal Adoption and Care System</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body.login-page {
            min-height: 100vh;
            background: #DAF1DE;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            box-sizing: border-box;
        }

        .login-container {
            display: block !important;
            width: 100%;
            max-width: 460px;
            margin: 30px auto;
        }

        .login-introduction {
            display: none !important;
        }

        .login-form-section {
            width: 100% !important;
            padding: 0 !important;
            background: transparent !important;
        }

        .login-form-box {
            width: 100%;
            box-sizing: border-box;
            padding: 38px;
            background: #FFFFFF;
            border: 1px solid #B7D5BD;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(5, 31, 32, 0.08);
        }

        .login-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-heading h2 {
            color: #163832;
            font-size: 30px;
        }

        .login-heading p {
            color: #52685B;
        }

        #loginForm {
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
            padding: 0 !important;
        }

        .login-form-group {
            margin-bottom: 18px;
        }

        .login-form-group label {
            display: block;
            color: #235347;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .login-form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #B7D5BD;
            border-radius: 8px;
            background: #FFFFFF;
            color: #051F20;
        }

        .login-options {
            margin: 15px 0 22px;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #235347;
            color: #FFFFFF;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #163832;
        }

        .admin-register-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            padding: 12px;
            border: 1px solid #B7D5BD;
            border-radius: 8px;
            color: #235347;
            text-decoration: none;
            font-weight: bold;
        }

        .admin-register-link:hover {
            background: #DAF1DE;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #235347;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .login-form-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body class="login-page">

    <main class="login-container">
        <section class="login-form-section">

            <div class="login-form-box">

                <div class="login-heading">
                    <h2>Staff Login</h2>
                    <p>Enter your administrator account details to continue.</p>
                </div>

                <form id="loginForm">

                    <div class="login-form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            required
                        >
                    </div>

                    <div class="login-form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                    <div class="login-options">
                        <label>
                            <input type="checkbox" id="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="login-button">
                        Login
                    </button>

                    <div id="loginMessage" class="login-message-box"></div>

                </form>

                <a href="./admin-register.html" class="admin-register-link">
                    Create Admin Account
                </a>

                <a href="./index.html" class="back-home">
                    ← Back to Home
                </a>

            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>

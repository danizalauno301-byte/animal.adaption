
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopter Registration | Animal Care System</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .adopter-auth-container {
            max-width: 520px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .adopter-auth-card {
            background: #fffaf2;
            padding: 38px;
            border: 1px solid rgba(108, 77, 60, 0.12);
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(65, 46, 37, 0.10);
        }

        .adopter-auth-card h1 {
            color: #5b4033;
            font-family: Georgia, "Times New Roman", serif;
            margin-bottom: 8px;
        }

        .adopter-auth-card p {
            color: #786458;
            line-height: 1.6;
        }

        .adopter-auth-card label {
            display: block;
            margin: 16px 0 7px;
            color: #5f4639;
            font-size: 13px;
            font-weight: 700;
        }

        .adopter-auth-card input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #dbc7b1;
            border-radius: 10px;
            background: #fffdf8;
            font-size: 14px;
        }

        .adopter-auth-card button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #9a6047;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .adopter-auth-card button:hover {
            background: #7f4c38;
        }

        .auth-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
        }

        .auth-links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .auth-links a {
            color: #9a6047;
            font-weight: 700;
        }

        @media (max-width: 550px) {
            .adopter-auth-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="adopter-auth-container">
        <section class="adopter-auth-card">

            <h1>Create an Adopter Account</h1>
            <p>
                Register an account to apply for animal adoption
                through our Animal Adoption and Care System.
            </p>

            <form id="adopterRegisterForm">

                <label for="adopterFullName">Full Name</label>
                <input
                    type="text"
                    id="adopterFullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="adopterEmail">Email Address</label>
                <input
                    type="email"
                    id="adopterEmail"
                    placeholder="Enter your email address"
                    required
                >

                <label for="adopterPhone">Contact Number</label>
                <input
                    type="tel"
                    id="adopterPhone"
                    placeholder="Enter your contact number"
                    required
                >

                <label for="adopterUsername">Username</label>
                <input
                    type="text"
                    id="adopterUsername"
                    placeholder="Create a username"
                    required
                    minlength="4"
                >

                <label for="adopterPassword">Password</label>
                <input
                    type="password"
                    id="adopterPassword"
                    placeholder="Create a password"
                    required
                    minlength="6"
                >

                <label for="adopterConfirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="adopterConfirmPassword"
                    placeholder="Re-enter your password"
                    required
                    minlength="6"
                >

                <button type="submit">Register Account</button>

                <div
                    id="adopterRegisterMessage"
                    class="auth-message"
                    role="alert"
                ></div>

            </form>

            <div class="auth-links">
                Already have an account?
                <a href="adopter-login.html">Log in here</a>
                <br><br>
                <a href="index.html">Back to Home</a>
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
